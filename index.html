<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Mis Finanzas</title>
<meta name="description" content="App personal de finanzas: ingresos, gastos, presupuestos y reportes." />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#12141A" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Finanzas" />
<meta name="mobile-web-app-capable" content="yes" />

<style>
  html, body { margin:0; padding:0; background:#12141A; height:100%; overscroll-behavior-y:none; }
  #root { min-height:100vh; }
  #fz-boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#9096A3; font-family:-apple-system,sans-serif; font-size:13px; background:#12141A; }
</style>
</head>
<body>
<div id="root"><div id="fz-boot">Cargando tus finanzas…</div></div>

<script>
  // Red de seguridad: si algo falla antes de que React monte (o el bundle
  // lanza una excepción durante el arranque), evitamos que la pantalla se
  // quede negra/en "Cargando..." para siempre -- mostramos un mensaje con
  // botón de recarga.
  (function () {
    let shown = false;
    function showRecovery() {
      if (shown) return;
      shown = true;
      const boot = document.getElementById('fz-boot');
      if (!boot) return;
      boot.innerHTML = '';
      boot.style.flexDirection = 'column';
      boot.style.gap = '12px';
      boot.style.textAlign = 'center';
      boot.style.padding = '24px';
      const msg = document.createElement('div');
      msg.textContent = 'Algo salió mal al cargar la app.';
      const btn = document.createElement('button');
      btn.textContent = 'Recargar';
      btn.style.cssText = 'padding:10px 20px;border-radius:8px;border:none;background:#4C7EF3;color:#fff;font-size:14px;';
      btn.onclick = () => window.location.reload();
      boot.appendChild(msg);
      boot.appendChild(btn);
    }
    window.addEventListener('error', showRecovery);
    window.addEventListener('unhandledrejection', showRecovery);
    // Si el bundle nunca terminó de montar (#fz-boot sigue en el DOM) tras
    // un tiempo razonable, algo se colgó -- ofrecemos recargar.
    setTimeout(() => {
      if (document.getElementById('fz-boot')) showRecovery();
    }, 12000);
  })();
</script>

<script>
  // Registrar el service worker para que la app funcione offline una vez instalada.
  // Cuando hay una versión nueva, el propio SW la activa (skipWaiting + clients.claim)
  // y aquí recargamos la página una sola vez para mostrarla — sin borrar datos ni pedir reinstalar.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        reg.update().catch(() => {});
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update().catch(() => {});
        });
      }).catch(() => {});
    });
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded) return;
      // Si hay una verificación de PIN/Face ID en curso, esperamos a que termine
      // antes de recargar -- si no, la recarga cancela el diálogo nativo a mitad
      // de camino y el usuario ve el prompt de biometría aparecer y desaparecer.
      const doReload = () => { reloaded = true; window.location.reload(); };
      if (window.__fzAuthBusy) {
        let waited = 0;
        const check = setInterval(() => {
          waited += 250;
          if (!window.__fzAuthBusy || waited >= 10000) { clearInterval(check); doReload(); }
        }, 250);
      } else {
        doReload();
      }
    });
  }

  // --- Shim de almacenamiento: reemplaza window.storage (propio de los artifacts de Claude)
  // por localStorage, con la misma interfaz async que usa el código original.
  (function () {
    function keyFor(key, shared) {
      return (shared ? 'fz_shared__' : 'fz__') + key;
    }
    window.storage = {
      async get(key, shared) {
        const raw = localStorage.getItem(keyFor(key, shared));
        if (raw === null || raw === undefined) return null;
        return { key, value: raw, shared: !!shared };
      },
      async set(key, value, shared) {
        localStorage.setItem(keyFor(key, shared), value);
        return { key, value, shared: !!shared };
      },
      async delete(key, shared) {
        const existed = localStorage.getItem(keyFor(key, shared)) !== null;
        localStorage.removeItem(keyFor(key, shared));
        return { key, deleted: existed, shared: !!shared };
      },
      async list(prefix, shared) {
        const p = keyFor(prefix || '', shared);
        const keys = Object.keys(localStorage)
          .filter(k => k.startsWith(shared ? 'fz_shared__' : 'fz__'))
          .filter(k => k.startsWith(p))
          .map(k => k.replace(shared ? 'fz_shared__' : 'fz__', ''));
        return { keys, prefix: prefix || undefined, shared: !!shared };
      }
    };
  })();
</script>

<script src="./bundle.js"></script>
</body>
</html>
